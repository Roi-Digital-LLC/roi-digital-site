<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="canonical" href="https://roidigital.ai/quiz/">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>Blueprint Assessment</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">

<style>
:root {
  --bg: #070E1B;
  --bg-card: #111F38;
  --bg-card-hover: #162848;
  --fg: #E4EAF3;
  --fg-muted: #8BA0BE;
  --fg-dim: #4E6585;
  --accent: #38BDF8;
  --accent-dim: rgba(56,189,248,0.10);
  --gold: #D4A056;
  --gold-hover: #E0B570;
  --gold-dim: rgba(212,160,86,0.12);
  --red: #EF6B6B;
  --green: #4ADE80;
  --border: #1A2E50;
  --grid-line: rgba(56,189,248,0.04);
  --option-bg: #0E1A30;
  --option-hover: #142240;
  --option-selected: rgba(56,189,248,0.12);
  --option-border-selected: var(--accent);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F2F5FA; --bg-card: #FFFFFF; --bg-card-hover: #F0F4FA;
    --fg: #0B1A2E; --fg-muted: #4A6180; --fg-dim: #8494A7;
    --accent: #0C7ABF; --accent-dim: rgba(12,122,191,0.07);
    --gold: #9E7520; --gold-hover: #8A6518; --gold-dim: rgba(158,117,32,0.08);
    --red: #C0392B; --green: #16A34A;
    --border: #D4DCE8; --grid-line: rgba(12,122,191,0.03);
    --option-bg: #F7F9FC; --option-hover: #EEF2F9;
    --option-selected: rgba(12,122,191,0.08);
    --option-border-selected: var(--accent);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F2F5FA; --bg-card: #FFFFFF; --bg-card-hover: #F0F4FA;
  --fg: #0B1A2E; --fg-muted: #4A6180; --fg-dim: #8494A7;
  --accent: #0C7ABF; --accent-dim: rgba(12,122,191,0.07);
  --gold: #9E7520; --gold-hover: #8A6518; --gold-dim: rgba(158,117,32,0.08);
  --red: #C0392B; --green: #16A34A;
  --border: #D4DCE8; --grid-line: rgba(12,122,191,0.03);
  --option-bg: #F7F9FC; --option-hover: #EEF2F9;
  --option-selected: rgba(12,122,191,0.08);
  --option-border-selected: var(--accent);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: 'Nunito Sans', system-ui, sans-serif;
  line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
html { height: 100%; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 100; background: var(--bg);
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 40px 40px; pointer-events: none;
}
h1, h2, h3, .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; line-height: 1.1; }
.serif { font-family: 'Lora', Georgia, serif; }
a { color: var(--accent); }

.quiz-wrap {
  max-width: 600px;
  margin: 0 auto;
  padding-block: 2rem 4rem;
  display: flex;
  flex-direction: column;
  min-height: calc(100% - 6rem);
}

/* — Progress — */
.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 2rem;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s ease;
  width: 0%;
}
.progress-label {
  font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--fg-dim); margin-bottom: 0.5rem;
  text-align: right;
}

/* — Screens — */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; }

/* — Intro screen — */
.intro { text-align: center; flex: 1; justify-content: center; }
.intro h1 {
  font-size: clamp(2rem, 7vw, 3.5rem);
  margin: 0;
}
.intro h1 em { font-style: normal; color: var(--gold); }
.intro p {
  font-family: 'Lora', serif;
  color: var(--fg-muted);
  font-size: 1.05rem;
  margin: 1rem auto 0;
  max-width: 42ch;
  line-height: 1.7;
}
.intro-meta {
  font-size: 0.8rem; color: var(--fg-dim);
  margin-top: 0.75rem;
}

/* — Questions — */
.q-screen { flex: 1; }
.q-text {
  font-family: 'Lora', serif;
  font-size: clamp(1.15rem, 3vw, 1.4rem);
  margin: 0 0 1.5rem;
  line-height: 1.5;
  text-wrap: balance;
}
.q-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.8rem;
  color: var(--fg-dim);
  letter-spacing: 0.15em;
  margin-bottom: 0.5rem;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.option {
  display: block;
  width: 100%;
  padding: 1rem 1.25rem;
  background: var(--option-bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  text-align: left;
  font-family: 'Nunito Sans', sans-serif;
  font-size: 0.95rem;
  color: var(--fg);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.option:hover { background: var(--option-hover); border-color: var(--fg-dim); }
.option.selected {
  background: var(--option-selected);
  border-color: var(--option-border-selected);
}

/* — Email capture — */
.capture { flex: 1; }
.capture h2 { font-size: 1.8rem; margin: 0 0 0.5rem; }
.capture p { color: var(--fg-muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
.field-group {
  display: flex; flex-direction: column; gap: 0.75rem;
  margin-bottom: 1rem;
}
.field label {
  display: block; font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--fg-dim); margin-bottom: 0.3rem;
}
.field input {
  width: 100%; padding: 0.75rem 1rem;
  background: var(--option-bg); border: 1.5px solid var(--border);
  border-radius: 6px; font-family: inherit; font-size: 0.95rem;
  color: var(--fg); outline: none;
}
.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--fg-dim); }
.birth-fields__removed {
  display: none; margin-top: 0.5rem;
  padding: 1rem; background: var(--accent-dim);
  border-radius: 8px;
}
.birth-fields.visible { display: block; }
.birth-fields p {
  font-size: 0.82rem; color: var(--fg-muted);
  margin: 0 0 0.75rem; line-height: 1.5;
}
.birth-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
}
@media (max-width: 400px) { .birth-row { grid-template-columns: 1fr; } }
.consent-row {
  display: flex; gap: 0.5rem; align-items: flex-start;
  margin-top: 0.75rem; font-size: 0.78rem; color: var(--fg-dim);
}
.consent-row input { margin-top: 0.2rem; flex-shrink: 0; }

/* — Buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 0.5rem; padding: 0.8rem 2rem; border-radius: 6px;
  font-family: 'Nunito Sans', sans-serif; font-size: 0.9rem;
  font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
  border: none; cursor: pointer; transition: background 0.15s, transform 0.1s;
  text-decoration: none;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--gold); color: #0B1A2E; }
.btn-primary:hover { background: var(--gold-hover); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary { background: transparent; color: var(--fg-muted); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--fg-muted); color: var(--fg); }
.btn-full { width: 100%; }
.btn-group { display: flex; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; }

/* — Results — */
.result { flex: 1; }
.result-badge {
  display: inline-block; font-size: 0.7rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.15em;
  background: var(--gold); color: #0B1A2E;
  padding: 0.3em 0.8em; border-radius: 4px; margin-bottom: 1rem;
}
.result h2 { font-size: clamp(1.8rem, 5vw, 2.5rem); margin: 0 0 0.25rem; }
.result-quote {
  font-family: 'Lora', serif; font-style: italic;
  font-size: 1.1rem; color: var(--gold);
  margin: 0 0 1.5rem;
}
.result-section { margin-bottom: 1.5rem; }
.result-section h3 {
  font-family: 'Nunito Sans', sans-serif;
  font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--accent); margin: 0 0 0.4rem;
}
.result-section p {
  font-size: 0.95rem; color: var(--fg-muted);
  margin: 0; line-height: 1.7;
}
.result-move {
  padding: 1rem 1.25rem;
  background: var(--gold-dim);
  border-left: 3px solid var(--gold);
  border-radius: 0 6px 6px 0;
  margin-bottom: 1.5rem;
}
.result-move h3 {
  font-family: 'Nunito Sans', sans-serif;
  font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--gold); margin: 0 0 0.3rem;
}
.result-move p {
  font-size: 0.92rem; color: var(--fg); margin: 0; line-height: 1.6;
}
.result-reveal {
  padding: 1rem 1.25rem;
  background: var(--accent-dim);
  border-left: 3px solid var(--accent);
  border-radius: 0 6px 6px 0;
  margin-bottom: 1.5rem;
}
.result-reveal h3 {
  font-family: 'Nunito Sans', sans-serif;
  font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--accent); margin: 0 0 0.3rem;
}
.result-reveal p {
  font-size: 0.92rem; color: var(--fg-muted); margin: 0; line-height: 1.6;
}
.result-cta {
  text-align: center; padding: 2rem 0;
  border-top: 1px solid var(--border);
  margin-top: 1rem;
}
.result-cta p {
  font-size: 0.85rem; color: var(--fg-dim);
  margin: 0.75rem 0 0;
}
</style>
</head>
<body>

<div class="quiz-wrap">
  <!-- INTRO -->
  <div class="screen active" id="intro-screen">
    <div class="intro">
      <h1>Why does growing your business feel <em>harder</em> than it should?</h1>
      <p>Find the one thing slowing you down, and the first move to fix it.</p>
      <div class="intro-meta">8 questions &middot; 2 minutes</div>
      <div class="btn-group" style="justify-content:center; margin-top:2rem;">
        <button class="btn btn-primary" onclick="startQuiz()">Start the Quiz</button>
      </div>
    </div>
  </div>

  <!-- QUESTION SCREENS (generated by JS) -->
  <div class="screen" id="question-screen">
    <div class="progress-label" id="progress-label">Question 1 of 8</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="q-screen">
      <div class="q-num" id="q-num"></div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options-container"></div>
    </div>
  </div>

  <!-- EMAIL CAPTURE -->
  <div class="screen" id="capture-screen">
    <div class="capture">
      <h2>Your Results Are Ready</h2>
      <p>Where should we send your results?</p>
      <div class="field-group">
        <div class="field">
          <label for="cap-name">First Name</label>
          <input type="text" id="cap-name" placeholder="Your first name" autocomplete="given-name">
        </div>
        <div class="field">
          <label for="cap-email">Email</label>
          <input type="email" id="cap-email" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>
      <div class="consent-row">
        <input type="checkbox" id="cap-consent" checked>
        <label for="cap-consent">I agree to receive my results and follow-up emails.</label>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary btn-full" id="cap-submit" onclick="showResults()">See My Results</button>
      </div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="result-screen">
    <div class="result" id="result-container"></div>
  </div>
</div>

<script>
var QUESTIONS = [
  {
    num: "Question 1",
    text: "Where’s your business right now?",
    options: [
      { label: "Just me, doing everything", tag: "solo" },
      { label: "Me plus a contractor or two", tag: "first_crew" },
      { label: "A small team, 3 to 15", tag: "growing" },
      { label: "Established, but stuck", tag: "stalled" }
    ]
  },
  {
    num: "Question 2",
    text: "What’s the biggest thing slowing your growth?",
    options: [
      { label: "I’m the bottleneck — everything runs through me", tag: "overloaded" },
      { label: "I don’t know who to hire, or hires haven’t worked", tag: "missing" },
      { label: "My team isn’t in sync", tag: "crossed" },
      { label: "I’m working hard but not getting the results", tag: "wrong_door" }
    ]
  },
  {
    num: "Question 3",
    text: "How do you usually make big business decisions?",
    options: [
      { label: "Quickly, on instinct", tag: "gut" },
      { label: "I think it through, sometimes for too long", tag: "mind" },
      { label: "I talk it out with people I trust", tag: "sound" },
      { label: "Honestly, I second-guess myself a lot", tag: "uncertain" }
    ]
  },
  {
    num: "Question 4",
    text: "By the end of a typical work week, you feel…",
    options: [
      { label: "Satisfied but tired", tag: "satisfied" },
      { label: "Frustrated, like I’m spinning my wheels", tag: "frustrated" },
      { label: "Unseen, like my work isn’t recognized", tag: "unseen" },
      { label: "Drained, like I absorbed everyone’s stress", tag: "drained" }
    ]
  },
  {
    num: "Question 5",
    text: "What drains you most?",
    options: [
      { label: "Starting things and chasing people", tag: "initiating" },
      { label: "Grinding through work I don’t love", tag: "grinding" },
      { label: "Being interrupted or controlled", tag: "controlled" },
      { label: "Other people’s moods and energy", tag: "absorbing" }
    ]
  },
  {
    num: "Question 6",
    text: "If you could hand off one thing tomorrow, what would it be?",
    options: [
      { label: "Admin and operations", tag: "ops" },
      { label: "Sales and follow-up", tag: "sales" },
      { label: "Content and marketing", tag: "content" },
      { label: "Managing people", tag: "people" }
    ]
  },
  {
    num: "Question 7",
    text: "What would success in the next 90 days look like?",
    options: [
      { label: "Hire my first right person", tag: "hire" },
      { label: "Get my team working together smoothly", tag: "team" },
      { label: "Grow revenue without burning out", tag: "grow" },
      { label: "Get clear on what I’m really building", tag: "clarity" }
    ]
  },
  {
    num: "Question 8",
    text: "How open are you to using frameworks like Human Design to tune how you build your business?",
    options: [
      { label: "Very open — I already use it or something similar", tag: "hot" },
      { label: "Curious, tell me more", tag: "warm" },
      { label: "I prefer practical tools only", tag: "practical" }
    ]
  }
];

var RESULTS = {
  overloaded: {
    name: "Overloaded Foundation",
    quote: "“Everything runs through me.”",
    mirror: "You are the sales team, the service team and the help desk. The money is real, but it stops when you stop. Time off feels like a risk.",
    cost: "Your growth can only go as far as your energy. If you burn out, the business has no plan for that.",
    reframe: "The business was built on your energy, but not on how your energy really works. Some people do best at a long, steady pace. Others do best in short bursts with rest in between. Running the wrong way wears you out faster. It’s not a discipline problem. It’s a fit problem.",
    move: "For one week, mark every task green (gives you energy) or red (drains you). Your first hire or system should take over the biggest red block.",
    hot_reveal: "Your blueprint shows your energy pattern: steady, burst-and-rest, or built to guide others instead of running the engine alone. It also shows how you make your best choices. Together they tell us which tasks should stay with you and which should go.",
    warm_reveal: "There’s a reason some weeks fill you up and others empty you, even when the workload is the same. It isn’t random. Once you see the pattern, you can build around it instead of against it.",
    sprint: "In weeks 2 and 3 of the sprint, we build your operating manual: when to work, how to decide, and what to hand off first."
  },
  missing: {
    name: "Missing Rooms",
    quote: "“I don’t know who to hire.”",
    mirror: "You know you need help. But every hire so far felt like a copy of you, or didn’t last. You keep doing tasks you hate because explaining them takes longer than doing them.",
    cost: "A wrong first hire costs you months of pay and training. Worse, it costs you the nerve to try again. So you go back to doing it all yourself.",
    reframe: "Most owners hire for what they’re good at, because that’s what they know how to judge. The real gap is the work you avoid, not the work you understand.",
    move: "List the three tasks you put off longest. That’s your first role. Describe it by the work, not by a job title. “I need someone who loves the follow-up I dread” beats “I need an assistant.”",
    hot_reveal: "Your blueprint shows where your energy is steady and where you borrow it from other people. The places you borrow point straight at the role to fill first.",
    warm_reveal: "There’s a pattern to which tasks drain you and which don’t. It’s not about discipline. Some work just isn’t a fit for how you’re built. Once you see the pattern, hiring gets much clearer.",
    sprint: "In weeks 4 and 5 of the sprint, we build your crew plan: a first-hire profile and a hand-off list that sticks."
  },
  crossed: {
    name: "Crossed Wires",
    quote: "“My team isn’t in sync.”",
    mirror: "Good people, tense meetings. Decisions stall or get made twice. Someone is always frustrated and you can’t say why. You feel more like a referee than a leader.",
    cost: "Slow decisions. People quietly leaving. You stuck in the middle. The team has talent, but the tension is costing you speed and trust.",
    reframe: "People pick up each other’s stress without knowing it. One person’s bad day spreads to the whole room. Nobody is wrong. The signals are crossed. Clear them up and the same team moves faster.",
    move: "Write down who owns your three biggest decisions. Wherever two names show up for the same decision, you’ve found a crossed wire.",
    hot_reveal: "Your blueprint shows how you’re built to lead and how you make your best choices. When a team can see each other’s designs, the friction starts to make sense.",
    warm_reveal: "There’s a reason some teams click and others grind, even when everyone is good at their job. It’s about how people affect each other. Mapping it changes the conversation.",
    sprint: "In weeks 4 and 5 of the sprint, we map the team: who decides what, plus a one-page guide for each person."
  },
  wrong_door: {
    name: "Wrong Front Door",
    quote: "“Working hard, wrong results.”",
    mirror: "You’re doing what the playbooks say: posting, cold outreach, launches. The effort is high and the return is thin. It feels like pushing a door that won’t open.",
    cost: "Months spent on plans built for someone else. And a growing feeling that something is wrong with you. It isn’t you. It’s the plan.",
    reframe: "Some people do well starting cold. Many do better answering demand, or being asked in for what they know. Your marketing should fit the way you naturally win clients.",
    move: "Look at your last five best clients. How did each one start: you chased them, they came to you, or someone sent them? That pattern is your front door. Build from there.",
    hot_reveal: "Your blueprint shows how you’re built to reach people: by starting things, by answering demand, or by being asked in for what you know. That shapes your whole sales plan: where you show up, how often, and what you say.",
    warm_reveal: "There’s a reason some ways of selling feel natural and others feel like pushing uphill. It’s not effort or skill. It’s fit.",
    sprint: "In weeks 4 to 6 of the sprint, we sharpen your offer, rebuild your message and load your Business Brain, so your marketing fits you."
  }
};

var answers = [];
var currentQ = 0;

function startQuiz() {
  document.getElementById('intro-screen').classList.remove('active');
  document.getElementById('question-screen').classList.add('active');
  showQuestion(0);
}

function showQuestion(idx) {
  currentQ = idx;
  var q = QUESTIONS[idx];
  var total = QUESTIONS.length;
  document.getElementById('progress-label').textContent = 'Question ' + (idx + 1) + ' of ' + total;
  document.getElementById('progress-fill').style.width = ((idx + 1) / total * 100) + '%';
  document.getElementById('q-num').textContent = q.num.toUpperCase();
  document.getElementById('q-text').textContent = q.text;

  var container = document.getElementById('options-container');
  container.innerHTML = '';
  q.options.forEach(function(opt, i) {
    var btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.label;
    if (answers[idx] && answers[idx].tag === opt.tag) {
      btn.classList.add('selected');
    }
    btn.addEventListener('click', function() {
      answers[idx] = opt;
      container.querySelectorAll('.option').forEach(function(b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      setTimeout(function() {
        if (idx < total - 1) {
          showQuestion(idx + 1);
        } else {
          goToCapture();
        }
      }, 250);
    });
    container.appendChild(btn);
  });
}

function goToCapture() {
  document.getElementById('question-screen').classList.remove('active');
  document.getElementById('capture-screen').classList.add('active');

}

function getStage() {
  if (!answers[1]) return 'overloaded';
  var map = { overloaded: 'overloaded', missing: 'missing', crossed: 'crossed', wrong_door: 'wrong_door' };
  return map[answers[1].tag] || 'overloaded';
}

function getTrack() {
  if (!answers[7]) return 'practical';
  return answers[7].tag;
}

function showResults() {
  var name = document.getElementById('cap-name').value.trim();
  var email = document.getElementById('cap-email').value.trim();
  if (!name || !email) {
    document.getElementById('cap-name').style.borderColor = name ? '' : 'var(--red)';
    document.getElementById('cap-email').style.borderColor = email ? '' : 'var(--red)';
    return;
  }

  var stage = getStage();
  var track = getTrack();
  var r = RESULTS[stage];

  var html = '';
  html += '<div class="result-badge">Your Build Stage</div>';
  html += '<h2>' + r.name + '</h2>';
  html += '<div class="result-quote">' + r.quote + '</div>';

  html += '<div class="result-section"><h3>Where You Are</h3><p>' + r.mirror + '</p></div>';
  html += '<div class="result-section"><h3>What It Costs You</h3><p>' + r.cost + '</p></div>';
  html += '<div class="result-section"><h3>What’s Really Going On</h3><p>' + r.reframe + '</p></div>';

  html += '<div class="result-move"><h3>Your First Move (Free)</h3><p>' + r.move + '</p></div>';

  if (track === 'hot') {
    html += '<div class="result-reveal"><h3>Your Blueprint Preview</h3><p>' + r.hot_reveal + '</p></div>';
  } else if (track === 'warm') {
    html += '<div class="result-reveal"><h3>There’s a Reason</h3><p>' + r.warm_reveal + '</p></div>';
  }

  html += '<div class="result-section"><h3>What the Sprint Does About It</h3><p>' + r.sprint + '</p></div>';

  html += '<div class="result-cta">';
  if (track === 'hot') {
    html += '<a href="/#book" class="btn btn-primary btn-full">See Your Full Blueprint on a Call</a>';
  } else if (track === 'warm') {
    html += '<a href="/#book" class="btn btn-primary btn-full">See What Fits You</a>';
  } else {
    html += '<a href="/#book" class="btn btn-primary btn-full">Plan Your Next Six Weeks</a>';
  }
  html += '<p>Book a free 20-minute call with Kevin.</p>';
  html += '</div>';

  document.getElementById('result-container').innerHTML = html;
  document.getElementById('capture-screen').classList.remove('active');
  document.getElementById('result-screen').classList.add('active');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
