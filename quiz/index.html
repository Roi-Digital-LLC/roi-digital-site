<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROI Digital | 5 Quick Questions</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">

<style>
:root {
  --bg: #070E1B;
  --bg-card: #111F38;
  --bg-card-hover: #162848;
  --fg: #E4EAF3;
  --fg-muted: #8BA0BE;
  --fg-dim: #4E6585;
  --accent: #38BDF8;
  --accent-dim: rgba(56,189,248,0.10);
  --gold: #D4A056;
  --gold-hover: #E0B570;
  --gold-dim: rgba(212,160,86,0.12);
  --red: #EF6B6B;
  --green: #4ADE80;
  --border: #1A2E50;
  --grid-line: rgba(56,189,248,0.04);
  --option-bg: #0E1A30;
  --option-hover: #142240;
  --option-selected: rgba(56,189,248,0.12);
  --option-border-selected: var(--accent);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F2F5FA; --bg-card: #FFFFFF; --bg-card-hover: #F0F4FA;
    --fg: #0B1A2E; --fg-muted: #4A6180; --fg-dim: #8494A7;
    --accent: #0C7ABF; --accent-dim: rgba(12,122,191,0.07);
    --gold: #9E7520; --gold-hover: #8A6518; --gold-dim: rgba(158,117,32,0.08);
    --red: #C0392B; --green: #16A34A;
    --border: #D4DCE8; --grid-line: rgba(12,122,191,0.03);
    --option-bg: #F7F9FC; --option-hover: #EEF2F9;
    --option-selected: rgba(12,122,191,0.08);
    --option-border-selected: var(--accent);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F2F5FA; --bg-card: #FFFFFF; --bg-card-hover: #F0F4FA;
  --fg: #0B1A2E; --fg-muted: #4A6180; --fg-dim: #8494A7;
  --accent: #0C7ABF; --accent-dim: rgba(12,122,191,0.07);
  --gold: #9E7520; --gold-hover: #8A6518; --gold-dim: rgba(158,117,32,0.08);
  --red: #C0392B; --green: #16A34A;
  --border: #D4DCE8; --grid-line: rgba(12,122,191,0.03);
  --option-bg: #F7F9FC; --option-hover: #EEF2F9;
  --option-selected: rgba(12,122,191,0.08);
  --option-border-selected: var(--accent);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: 'Nunito Sans', system-ui, sans-serif;
  line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
html { height: 100%; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 100; background: var(--bg);
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 40px 40px; pointer-events: none;
}
h1, h2, h3, .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; line-height: 1.1; }
.serif { font-family: 'Lora', Georgia, serif; }
a { color: var(--accent); }

.quiz-wrap {
  max-width: 600px;
  margin: 0 auto;
  padding-block: 2rem 4rem;
  display: flex;
  flex-direction: column;
  min-height: calc(100% - 6rem);
}

/* — Progress — */
.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 2rem;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s ease;
  width: 0%;
}
.progress-label {
  font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--fg-dim); margin-bottom: 0.5rem;
  text-align: right;
}

/* — Screens — */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; }

/* — Intro screen — */
.intro { text-align: center; flex: 1; justify-content: center; }
.intro h1 {
  font-size: clamp(2rem, 7vw, 3.5rem);
  margin: 0;
}
.intro h1 em { font-style: normal; color: var(--gold); }
.intro p {
  font-family: 'Lora', serif;
  color: var(--fg-muted);
  font-size: 1.05rem;
  margin: 1rem auto 0;
  max-width: 42ch;
  line-height: 1.7;
}
.intro-meta {
  font-size: 0.8rem; color: var(--fg-dim);
  margin-top: 0.75rem;
}

/* — Questions — */
.q-screen { flex: 1; }
.q-text {
  font-family: 'Lora', serif;
  font-size: clamp(1.15rem, 3vw, 1.4rem);
  margin: 0 0 1.5rem;
  line-height: 1.5;
  text-wrap: balance;
}
.q-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.8rem;
  color: var(--fg-dim);
  letter-spacing: 0.15em;
  margin-bottom: 0.5rem;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.option {
  display: block;
  width: 100%;
  padding: 1rem 1.25rem;
  background: var(--option-bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  text-align: left;
  font-family: 'Nunito Sans', sans-serif;
  font-size: 0.95rem;
  color: var(--fg);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.option:hover { background: var(--option-hover); border-color: var(--fg-dim); }
.option.selected {
  background: var(--option-selected);
  border-color: var(--option-border-selected);
}

/* — Email capture — */
.capture { flex: 1; }
.capture h2 { font-size: 1.8rem; margin: 0 0 0.5rem; }
.capture p { color: var(--fg-muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
.field-group {
  display: flex; flex-direction: column; gap: 0.75rem;
  margin-bottom: 1rem;
}
.field label {
  display: block; font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--fg-dim); margin-bottom: 0.3rem;
}
.field input {
  width: 100%; padding: 0.75rem 1rem;
  background: var(--option-bg); border: 1.5px solid var(--border);
  border-radius: 6px; font-family: inherit; font-size: 0.95rem;
  color: var(--fg); outline: none;
}
.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--fg-dim); }
.birth-fields__removed {
  display: none; margin-top: 0.5rem;
  padding: 1rem; background: var(--accent-dim);
  border-radius: 8px;
}
.birth-fields.visible { display: block; }
.birth-fields p {
  font-size: 0.82rem; color: var(--fg-muted);
  margin: 0 0 0.75rem; line-height: 1.5;
}
.birth-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
}
@media (max-width: 400px) { .birth-row { grid-template-columns: 1fr; } }
.consent-row {
  display: flex; gap: 0.5rem; align-items: flex-start;
  margin-top: 0.75rem; font-size: 0.78rem; color: var(--fg-dim);
}
.consent-row input { margin-top: 0.2rem; flex-shrink: 0; }

/* — Buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 0.5rem; padding: 0.8rem 2rem; border-radius: 6px;
  font-family: 'Nunito Sans', sans-serif; font-size: 0.9rem;
  font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
  border: none; cursor: pointer; transition: background 0.15s, transform 0.1s;
  text-decoration: none;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--gold); color: #0B1A2E; }
.btn-primary:hover { background: var(--gold-hover); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary { background: transparent; color: var(--fg-muted); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--fg-muted); color: var(--fg); }
.btn-full { width: 100%; }
.btn-group { display: flex; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; }

/* — Results — */
.result { flex: 1; }
.result-badge {
  display: inline-block; font-size: 0.7rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.15em;
  background: var(--gold); color: #0B1A2E;
  padding: 0.3em 0.8em; border-radius: 4px; margin-bottom: 1rem;
}
.result h2 { font-size: clamp(1.8rem, 5vw, 2.5rem); margin: 0 0 0.25rem; }
.result-quote {
  font-family: 'Lora', serif; font-style: italic;
  font-size: 1.1rem; color: var(--gold);
  margin: 0 0 1.5rem;
}
.result-section { margin-bottom: 1.5rem; }
.result-section h3 {
  font-family: 'Nunito Sans', sans-serif;
  font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--accent); margin: 0 0 0.4rem;
}
.result-section p {
  font-size: 0.95rem; color: var(--fg-muted);
  margin: 0; line-height: 1.7;
}
.result-move {
  padding: 1rem 1.25rem;
  background: var(--gold-dim);
  border-left: 3px solid var(--gold);
  border-radius: 0 6px 6px 0;
  margin-bottom: 1.5rem;
}
.result-move h3 {
  font-family: 'Nunito Sans', sans-serif;
  font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--gold); margin: 0 0 0.3rem;
}
.result-move p {
  font-size: 0.92rem; color: var(--fg); margin: 0; line-height: 1.6;
}
.result-reveal {
  padding: 1rem 1.25rem;
  background: var(--accent-dim);
  border-left: 3px solid var(--accent);
  border-radius: 0 6px 6px 0;
  margin-bottom: 1.5rem;
}
.result-reveal h3 {
  font-family: 'Nunito Sans', sans-serif;
  font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--accent); margin: 0 0 0.3rem;
}
.result-reveal p {
  font-size: 0.92rem; color: var(--fg-muted); margin: 0; line-height: 1.6;
}
.result-cta {
  text-align: center; padding: 2rem 0;
  border-top: 1px solid var(--border);
  margin-top: 1rem;
}
.result-cta p {
  font-size: 0.85rem; color: var(--fg-dim);
  margin: 0.75rem 0 0;
}
/* — Bigger type for phones — */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.intro h1 { font-size: clamp(3rem, 14vw, 4.5rem); line-height: 1; }
.intro p { font-size: 1.4rem; line-height: 1.45; }
.intro-meta, .progress-label, .q-num { font-size: 1rem; }
.q-text { font-size: clamp(1.7rem, 7vw, 2.1rem); line-height: 1.2; }
.option { font-size: 1.25rem; line-height: 1.3; min-height: 64px; }
.capture h2 { font-size: 2.4rem; line-height: 1.05; }
.capture p { font-size: 1.3rem; }
.field label { font-size: 1rem; }
.field input { font-size: 1.2rem; min-height: 56px; }
.consent-row { font-size: 1.05rem; line-height: 1.4; }
.btn { font-size: 1.1rem; min-height: 60px; }
.result-badge { font-size: 1rem; }
.result h2 { font-size: clamp(2.5rem, 11vw, 3.4rem); line-height: 1; }
.result-quote { font-size: 1.4rem; }
.result-section h3, .result-move h3 { font-size: 1.05rem; }
.result-section p, .result-move p { font-size: 1.35rem; line-height: 1.45; }
.result-cta p { font-size: 1.1rem; }
</style>

<div class="quiz-wrap">
  <!-- INTRO -->
  <div class="screen active" id="intro-screen">
    <div class="intro">
      <h1>Where is your business <em>losing money?</em></h1>
      <p>Five quick questions. Then a free 20-minute assessment.</p>
      <div class="intro-meta">5 questions &middot; 1 minute</div>
      <div class="btn-group" style="justify-content:center; margin-top:2rem;">
        <button class="btn btn-primary" onclick="startQuiz()">Start</button>
      </div>
    </div>
  </div>

  <!-- QUESTION SCREENS (generated by JS) -->
  <div class="screen" id="question-screen">
    <div class="progress-label" id="progress-label">Question 1 of 5</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="q-screen">
      <div class="q-num" id="q-num"></div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options-container"></div>
    </div>
  </div>

  <!-- EMAIL CAPTURE -->
  <div class="screen" id="capture-screen">
    <div class="capture">
      <h2>Your Result Is Ready</h2>
      <p>Where should we send your results?</p>
      <div class="field-group">
        <div class="field">
          <label for="cap-name">First Name</label>
          <input type="text" id="cap-name" placeholder="Your first name" autocomplete="given-name">
        </div>
        <div class="field">
          <label for="cap-email">Email</label>
          <input type="email" id="cap-email" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>
      <div class="consent-row">
        <input type="checkbox" id="cap-consent" checked>
        <label for="cap-consent">I agree to receive my results and follow-up emails.</label>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary btn-full" id="cap-submit" onclick="showResults()">See My Results</button>
      </div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="result-screen">
    <div class="result" id="result-container"></div>
  </div>
</div>

<script>
var QUESTIONS = [
  { num: "Question 1", text: "What kind of business do you run?", options: [
    { label: "Contractor: HVAC, plumbing, electrical, restoration", tag: "contractor" },
    { label: "Dental practice or med spa", tag: "practice" },
    { label: "Real estate or property management", tag: "real_estate" },
    { label: "Law firm", tag: "law" },
    { label: "Hotel, inn or event venue", tag: "hospitality" },
    { label: "Something else", tag: "other" } ] },
  { num: "Question 2", text: "What’s your annual revenue?", options: [
    { label: "Under $1M", tag: "under_1m" },
    { label: "$1M to $3M", tag: "1_3m" },
    { label: "$3M to $10M", tag: "3_10m" },
    { label: "Over $10M", tag: "over_10m" } ] },
  { num: "Question 3", text: "How many employees?", options: [
    { label: "1 to 4", tag: "1_4" },
    { label: "5 to 15", tag: "5_15" },
    { label: "16 to 35", tag: "16_35" },
    { label: "More than 35", tag: "over_35" } ] },
  { num: "Question 4", text: "Where’s the biggest bottleneck?", options: [
    { label: "Missed calls", tag: "missed" },
    { label: "Slow follow-up on leads and estimates", tag: "followup" },
    { label: "Repetitive office work", tag: "office" },
    { label: "Too much depends on me", tag: "owner" } ] },
  { num: "Question 5", text: "When do you want it fixed?", options: [
    { label: "Now", tag: "now" },
    { label: "In the next 30 days", tag: "30_days" },
    { label: "This quarter", tag: "quarter" },
    { label: "Just looking", tag: "looking" } ] }
];

var RESULTS = {
  missed: {
    name: "Missed Calls",
    quote: "“What happens when everybody’s busy?”",
    mirror: "You spend money to make the phone ring. When the office is tied up, the caller moves on.",
    cost: "Every unanswered new-customer call is a job someone else may book. If nobody measures it, nobody knows the number.",
    move: "Pull a few weeks of call data. Count the missed calls. Count how many callbacks became jobs.",
    sprint: "A measured missed-call recovery pilot. Not a new phone system."
  },
  followup: {
    name: "Slow Follow-Up",
    quote: "“The estimate went out. Then nothing.”",
    mirror: "Inquiries come in. Estimates go out. Follow-up depends on who has time.",
    cost: "Leads you already paid for never turn into customers.",
    move: "Take your last ten unaccepted estimates. How many got a second contact?",
    sprint: "Fix the follow-up in the system you already have, before adding another tool."
  },
  office: {
    name: "Repetitive Office Work",
    quote: "“The same tasks, every day.”",
    mirror: "Scheduling, reminders and routine questions eat your best employees’ time.",
    cost: "Hours spent on repeat tasks are hours not spent on customers.",
    move: "Ask your office lead which task they repeat most. Time it for one week.",
    sprint: "Automate one routine task, with a person as the fallback."
  },
  owner: {
    name: "Too Much Depends on You",
    quote: "“It all still reaches me.”",
    mirror: "Questions, decisions and loose ends all land on the owner.",
    cost: "The business moves at the speed of one person.",
    move: "For one week, list every task that reached you and shouldn’t have.",
    sprint: "Start with the one task that reaches you most often."
  }
};

var answers = [];
var currentQ = 0;

function startQuiz() {
  document.getElementById('intro-screen').classList.remove('active');
  document.getElementById('question-screen').classList.add('active');
  showQuestion(0);
}

function showQuestion(idx) {
  currentQ = idx;
  var q = QUESTIONS[idx];
  var total = QUESTIONS.length;
  document.getElementById('progress-label').textContent = 'Question ' + (idx + 1) + ' of ' + total;
  document.getElementById('progress-fill').style.width = ((idx + 1) / total * 100) + '%';
  document.getElementById('q-num').textContent = q.num.toUpperCase();
  document.getElementById('q-text').textContent = q.text;

  var container = document.getElementById('options-container');
  container.innerHTML = '';
  q.options.forEach(function(opt, i) {
    var btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.label;
    if (answers[idx] && answers[idx].tag === opt.tag) {
      btn.classList.add('selected');
    }
    btn.addEventListener('click', function() {
      answers[idx] = opt;
      container.querySelectorAll('.option').forEach(function(b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      setTimeout(function() {
        if (idx < total - 1) {
          showQuestion(idx + 1);
        } else {
          goToCapture();
        }
      }, 250);
    });
    container.appendChild(btn);
  });
}

function goToCapture() {
  document.getElementById('question-screen').classList.remove('active');
  document.getElementById('capture-screen').classList.add('active');

}

function getStage() {
  if (!answers[3]) return 'missed';
  return RESULTS[answers[3].tag] ? answers[3].tag : 'missed';
}

function showResults() {
  var name = document.getElementById('cap-name').value.trim();
  var email = document.getElementById('cap-email').value.trim();
  if (!name || !email) {
    document.getElementById('cap-name').style.borderColor = name ? '' : 'var(--red)';
    document.getElementById('cap-email').style.borderColor = email ? '' : 'var(--red)';
    return;
  }

  var stage = getStage();
  var r = RESULTS[stage];

  var html = '';
  html += '<div class="result-badge">Your Bottleneck</div>';
  html += '<h2>' + r.name + '</h2>';
  html += '<div class="result-quote">' + r.quote + '</div>';

  html += '<div class="result-section"><h3>What’s Happening</h3><p>' + r.mirror + '</p></div>';
  html += '<div class="result-section"><h3>What It Costs You</h3><p>' + r.cost + '</p></div>';
  html += '<div class="result-move"><h3>Your First Move (Free)</h3><p>' + r.move + '</p></div>';
  html += '<div class="result-section"><h3>Where We’d Start</h3><p>' + r.sprint + '</p></div>';

  html += '<div class="result-cta">';
  html += '<a href="../#book" class="btn btn-primary btn-full">Book Your AI Assessment</a>';
  html += '<p>Free. 20 minutes. A diagnostic, not a promise of savings.</p>';
  html += '</div>';

  document.getElementById('result-container').innerHTML = html;
  document.getElementById('capture-screen').classList.remove('active');
  document.getElementById('result-screen').classList.add('active');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
