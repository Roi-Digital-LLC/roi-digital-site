<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROI Digital | 2-Minute Assessment</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">

<style>
:root {
  --bg: #070E1B;
  --bg-card: #111F38;
  --bg-card-hover: #162848;
  --fg: #E4EAF3;
  --fg-muted: #8BA0BE;
  --fg-dim: #4E6585;
  --accent: #38BDF8;
  --accent-dim: rgba(56,189,248,0.10);
  --gold: #D4A056;
  --gold-hover: #E0B570;
  --gold-dim: rgba(212,160,86,0.12);
  --red: #EF6B6B;
  --green: #4ADE80;
  --border: #1A2E50;
  --grid-line: rgba(56,189,248,0.04);
  --option-bg: #0E1A30;
  --option-hover: #142240;
  --option-selected: rgba(56,189,248,0.12);
  --option-border-selected: var(--accent);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F2F5FA; --bg-card: #FFFFFF; --bg-card-hover: #F0F4FA;
    --fg: #0B1A2E; --fg-muted: #4A6180; --fg-dim: #8494A7;
    --accent: #0C7ABF; --accent-dim: rgba(12,122,191,0.07);
    --gold: #9E7520; --gold-hover: #8A6518; --gold-dim: rgba(158,117,32,0.08);
    --red: #C0392B; --green: #16A34A;
    --border: #D4DCE8; --grid-line: rgba(12,122,191,0.03);
    --option-bg: #F7F9FC; --option-hover: #EEF2F9;
    --option-selected: rgba(12,122,191,0.08);
    --option-border-selected: var(--accent);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F2F5FA; --bg-card: #FFFFFF; --bg-card-hover: #F0F4FA;
  --fg: #0B1A2E; --fg-muted: #4A6180; --fg-dim: #8494A7;
  --accent: #0C7ABF; --accent-dim: rgba(12,122,191,0.07);
  --gold: #9E7520; --gold-hover: #8A6518; --gold-dim: rgba(158,117,32,0.08);
  --red: #C0392B; --green: #16A34A;
  --border: #D4DCE8; --grid-line: rgba(12,122,191,0.03);
  --option-bg: #F7F9FC; --option-hover: #EEF2F9;
  --option-selected: rgba(12,122,191,0.08);
  --option-border-selected: var(--accent);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: 'Nunito Sans', system-ui, sans-serif;
  line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
html { height: 100%; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 100; background: var(--bg);
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 40px 40px; pointer-events: none;
}
h1, h2, h3, .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; line-height: 1.1; }
.serif { font-family: 'Lora', Georgia, serif; }
a { color: var(--accent); }

.quiz-wrap {
  max-width: 600px;
  margin: 0 auto;
  padding-block: 2rem 4rem;
  display: flex;
  flex-direction: column;
  min-height: calc(100% - 6rem);
}

/* — Progress — */
.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 2rem;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s ease;
  width: 0%;
}
.progress-label {
  font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--fg-dim); margin-bottom: 0.5rem;
  text-align: right;
}

/* — Screens — */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; }

/* — Intro screen — */
.intro { text-align: center; flex: 1; justify-content: center; }
.intro h1 {
  font-size: clamp(2rem, 7vw, 3.5rem);
  margin: 0;
}
.intro h1 em { font-style: normal; color: var(--gold); }
.intro p {
  font-family: 'Lora', serif;
  color: var(--fg-muted);
  font-size: 1.05rem;
  margin: 1rem auto 0;
  max-width: 42ch;
  line-height: 1.7;
}
.intro-meta {
  font-size: 0.8rem; color: var(--fg-dim);
  margin-top: 0.75rem;
}

/* — Questions — */
.q-screen { flex: 1; }
.q-text {
  font-family: 'Lora', serif;
  font-size: clamp(1.15rem, 3vw, 1.4rem);
  margin: 0 0 1.5rem;
  line-height: 1.5;
  text-wrap: balance;
}
.q-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.8rem;
  color: var(--fg-dim);
  letter-spacing: 0.15em;
  margin-bottom: 0.5rem;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.option {
  display: block;
  width: 100%;
  padding: 1rem 1.25rem;
  background: var(--option-bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  text-align: left;
  font-family: 'Nunito Sans', sans-serif;
  font-size: 0.95rem;
  color: var(--fg);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.option:hover { background: var(--option-hover); border-color: var(--fg-dim); }
.option.selected {
  background: var(--option-selected);
  border-color: var(--option-border-selected);
}

/* — Email capture — */
.capture { flex: 1; }
.capture h2 { font-size: 1.8rem; margin: 0 0 0.5rem; }
.capture p { color: var(--fg-muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
.field-group {
  display: flex; flex-direction: column; gap: 0.75rem;
  margin-bottom: 1rem;
}
.field label {
  display: block; font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--fg-dim); margin-bottom: 0.3rem;
}
.field input {
  width: 100%; padding: 0.75rem 1rem;
  background: var(--option-bg); border: 1.5px solid var(--border);
  border-radius: 6px; font-family: inherit; font-size: 0.95rem;
  color: var(--fg); outline: none;
}
.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--fg-dim); }
.birth-fields__removed {
  display: none; margin-top: 0.5rem;
  padding: 1rem; background: var(--accent-dim);
  border-radius: 8px;
}
.birth-fields.visible { display: block; }
.birth-fields p {
  font-size: 0.82rem; color: var(--fg-muted);
  margin: 0 0 0.75rem; line-height: 1.5;
}
.birth-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
}
@media (max-width: 400px) { .birth-row { grid-template-columns: 1fr; } }
.consent-row {
  display: flex; gap: 0.5rem; align-items: flex-start;
  margin-top: 0.75rem; font-size: 0.78rem; color: var(--fg-dim);
}
.consent-row input { margin-top: 0.2rem; flex-shrink: 0; }

/* — Buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 0.5rem; padding: 0.8rem 2rem; border-radius: 6px;
  font-family: 'Nunito Sans', sans-serif; font-size: 0.9rem;
  font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
  border: none; cursor: pointer; transition: background 0.15s, transform 0.1s;
  text-decoration: none;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--gold); color: #0B1A2E; }
.btn-primary:hover { background: var(--gold-hover); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary { background: transparent; color: var(--fg-muted); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--fg-muted); color: var(--fg); }
.btn-full { width: 100%; }
.btn-group { display: flex; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; }

/* — Results — */
.result { flex: 1; }
.result-badge {
  display: inline-block; font-size: 0.7rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.15em;
  background: var(--gold); color: #0B1A2E;
  padding: 0.3em 0.8em; border-radius: 4px; margin-bottom: 1rem;
}
.result h2 { font-size: clamp(1.8rem, 5vw, 2.5rem); margin: 0 0 0.25rem; }
.result-quote {
  font-family: 'Lora', serif; font-style: italic;
  font-size: 1.1rem; color: var(--gold);
  margin: 0 0 1.5rem;
}
.result-section { margin-bottom: 1.5rem; }
.result-section h3 {
  font-family: 'Nunito Sans', sans-serif;
  font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--accent); margin: 0 0 0.4rem;
}
.result-section p {
  font-size: 0.95rem; color: var(--fg-muted);
  margin: 0; line-height: 1.7;
}
.result-move {
  padding: 1rem 1.25rem;
  background: var(--gold-dim);
  border-left: 3px solid var(--gold);
  border-radius: 0 6px 6px 0;
  margin-bottom: 1.5rem;
}
.result-move h3 {
  font-family: 'Nunito Sans', sans-serif;
  font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--gold); margin: 0 0 0.3rem;
}
.result-move p {
  font-size: 0.92rem; color: var(--fg); margin: 0; line-height: 1.6;
}
.result-reveal {
  padding: 1rem 1.25rem;
  background: var(--accent-dim);
  border-left: 3px solid var(--accent);
  border-radius: 0 6px 6px 0;
  margin-bottom: 1.5rem;
}
.result-reveal h3 {
  font-family: 'Nunito Sans', sans-serif;
  font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--accent); margin: 0 0 0.3rem;
}
.result-reveal p {
  font-size: 0.92rem; color: var(--fg-muted); margin: 0; line-height: 1.6;
}
.result-cta {
  text-align: center; padding: 2rem 0;
  border-top: 1px solid var(--border);
  margin-top: 1rem;
}
.result-cta p {
  font-size: 0.85rem; color: var(--fg-dim);
  margin: 0.75rem 0 0;
}
/* — Bigger type for phones — */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.intro h1 { font-size: clamp(3rem, 14vw, 4.5rem); line-height: 1; }
.intro p { font-size: 1.4rem; line-height: 1.45; }
.intro-meta, .progress-label, .q-num { font-size: 1rem; }
.q-text { font-size: clamp(1.7rem, 7vw, 2.1rem); line-height: 1.2; }
.option { font-size: 1.25rem; line-height: 1.3; min-height: 64px; }
.capture h2 { font-size: 2.4rem; line-height: 1.05; }
.capture p { font-size: 1.3rem; }
.field label { font-size: 1rem; }
.field input { font-size: 1.2rem; min-height: 56px; }
.consent-row { font-size: 1.05rem; line-height: 1.4; }
.btn { font-size: 1.1rem; min-height: 60px; }
.result-badge { font-size: 1rem; }
.result h2 { font-size: clamp(2.5rem, 11vw, 3.4rem); line-height: 1; }
.result-quote { font-size: 1.4rem; }
.result-section h3, .result-move h3 { font-size: 1.05rem; }
.result-section p, .result-move p { font-size: 1.35rem; line-height: 1.45; }
.result-cta p { font-size: 1.1rem; }
</style>

<div class="quiz-wrap">
  <!-- INTRO -->
  <div class="screen active" id="intro-screen">
    <div class="intro">
      <h1>Where is your business <em>stuck?</em></h1>
      <p>Find your bottleneck. Get one first move. Free.</p>
      <div class="intro-meta">7 questions &middot; 2 minutes</div>
      <div class="btn-group" style="justify-content:center; margin-top:2rem;">
        <button class="btn btn-primary" onclick="startQuiz()">Start</button>
      </div>
    </div>
  </div>

  <!-- QUESTION SCREENS (generated by JS) -->
  <div class="screen" id="question-screen">
    <div class="progress-label" id="progress-label">Question 1 of 7</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="q-screen">
      <div class="q-num" id="q-num"></div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options-container"></div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="result-screen">
    <div class="result" id="result-container"></div>
  </div>
</div>

<script>
var QUESTIONS = [
  { num: "Question 1", text: "Where’s your business right now?", options: [
    { label: "Just me, doing everything", tag: "solo" },
    { label: "Me plus a contractor or two", tag: "first_crew" },
    { label: "A small team, 3 to 15", tag: "growing" },
    { label: "Established, but stuck", tag: "stalled" } ] },
  { num: "Question 2", text: "What’s slowing you down most?", options: [
    { label: "Everything runs through me", tag: "overloaded" },
    { label: "I don’t know who to hire", tag: "missing" },
    { label: "My team isn’t in sync", tag: "crossed" },
    { label: "I work hard for thin results", tag: "wrong_door" } ] },
  { num: "Question 3", text: "When your team has a question, where’s the answer?", options: [
    { label: "In my head", tag: "head" },
    { label: "Scattered across docs and chats", tag: "scattered" },
    { label: "Written down, but nobody uses it", tag: "unused" },
    { label: "In one place they can search", tag: "one_place" } ] },
  { num: "Question 4", text: "What are you doing with AI today?", options: [
    { label: "Nothing yet", tag: "none" },
    { label: "ChatGPT now and then", tag: "casual" },
    { label: "A few tools, none connected", tag: "tools" },
    { label: "It’s built into how we work", tag: "built_in" } ] },
  { num: "Question 5", text: "A new lead comes in while you’re busy. What happens?", options: [
    { label: "It waits until I’m free", tag: "waits" },
    { label: "Someone follows up, sometimes", tag: "sometimes" },
    { label: "It’s answered the same day", tag: "same_day" },
    { label: "Honestly, I don’t know", tag: "unknown" } ] },
  { num: "Question 6", text: "What would you hand off tomorrow?", options: [
    { label: "Admin and operations", tag: "ops" },
    { label: "Sales and follow-up", tag: "sales" },
    { label: "Content and marketing", tag: "content" },
    { label: "Managing people", tag: "people" } ] },
  { num: "Question 7", text: "What does a win look like in 90 days?", options: [
    { label: "My first right hire", tag: "hire" },
    { label: "A team that works together", tag: "team" },
    { label: "More revenue without burning out", tag: "grow" },
    { label: "A clear offer and message", tag: "clarity" } ] }
];

var RESULTS = {
  overloaded: {
    name: "Everything Runs Through You",
    quote: "“Everything runs through me.”",
    mirror: "You’re sales, delivery and the help desk. Revenue is real. It stops the moment you do.",
    cost: "Your growth is capped by your own stamina. There’s no plan for the week you can’t work.",
    move: "For one week, write down every question your team asks you. The one that comes up most is the first thing to put in a system.",
    sprint: "We get how the business runs out of your head and into an AI brain your team can ask. Then we train them to use it."
  },
  missing: {
    name: "No One to Hand It To",
    quote: "“I don’t know who to hire.”",
    mirror: "You need help. But explaining the job takes longer than doing it. So you keep doing it.",
    cost: "A wrong hire costs months. So you stay solo, and the ceiling stays where it is.",
    move: "List the three tasks you put off longest. That’s your first role.",
    sprint: "We build your Crew Plan: a first-hire profile written around the work you shouldn’t be doing."
  },
  crossed: {
    name: "Team Out of Sync",
    quote: "“My team isn’t in sync.”",
    mirror: "Good people. Tense meetings. Decisions get made twice. You’re the referee.",
    cost: "Slow decisions and quiet turnover. And you, stuck in the middle.",
    move: "Write down who owns your three biggest decisions. Two names on one decision? That’s the tension.",
    sprint: "We map who owns which decisions and put the answers in one place the whole team can ask."
  },
  wrong_door: {
    name: "Working Hard, Thin Results",
    quote: "“Working hard, wrong results.”",
    mirror: "Posting. Outreach. Launches. High effort, thin return.",
    cost: "Months of marketing behind a message that isn’t landing. More volume won’t fix it.",
    move: "Look at your last five best clients. How did each one find you? Do more of that.",
    sprint: "We sharpen your offer and message first. Then we build a 90-day plan for your channels and content."
  }
};

var answers = [];
var currentQ = 0;

function startQuiz() {
  document.getElementById('intro-screen').classList.remove('active');
  document.getElementById('question-screen').classList.add('active');
  showQuestion(0);
}

function showQuestion(idx) {
  currentQ = idx;
  var q = QUESTIONS[idx];
  var total = QUESTIONS.length;
  document.getElementById('progress-label').textContent = 'Question ' + (idx + 1) + ' of ' + total;
  document.getElementById('progress-fill').style.width = ((idx + 1) / total * 100) + '%';
  document.getElementById('q-num').textContent = q.num.toUpperCase();
  document.getElementById('q-text').textContent = q.text;

  var container = document.getElementById('options-container');
  container.innerHTML = '';
  q.options.forEach(function(opt, i) {
    var btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.label;
    if (answers[idx] && answers[idx].tag === opt.tag) {
      btn.classList.add('selected');
    }
    btn.addEventListener('click', function() {
      answers[idx] = opt;
      container.querySelectorAll('.option').forEach(function(b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      setTimeout(function() {
        if (idx < total - 1) {
          showQuestion(idx + 1);
        } else {
          goToCapture();
        }
      }, 250);
    });
    container.appendChild(btn);
  });
}

function goToCapture() {
  showResults();
}

function getStage() {
  if (!answers[1]) return 'overloaded';
  var map = { overloaded: 'overloaded', missing: 'missing', crossed: 'crossed', wrong_door: 'wrong_door' };
  return map[answers[1].tag] || 'overloaded';
}

function showResults() {
  var stage = getStage();
  var r = RESULTS[stage];

  var html = '';
  html += '<div class="result-badge">Your Bottleneck</div>';
  html += '<h2>' + r.name + '</h2>';
  html += '<div class="result-quote">' + r.quote + '</div>';

  html += '<div class="result-section"><h3>What’s Happening</h3><p>' + r.mirror + '</p></div>';
  html += '<div class="result-section"><h3>What It Costs You</h3><p>' + r.cost + '</p></div>';
  html += '<div class="result-move"><h3>Your First Move (Free)</h3><p>' + r.move + '</p></div>';
  html += '<div class="result-section"><h3>What the Sprint Does</h3><p>' + r.sprint + '</p></div>';

  html += '<div class="result-cta">';
  html += '<a href="https://calendly.com/roidigital/30min" class="btn btn-primary btn-full">Book a Free Call</a>';
  html += '<p>Free. 30 minutes. With Kevin.</p>';
  html += '</div>';

  document.getElementById('result-container').innerHTML = html;
  document.getElementById('question-screen').classList.remove('active');
  document.getElementById('result-screen').classList.add('active');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
